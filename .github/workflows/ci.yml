name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install app deps
        run: npm install --legacy-peer-deps
      - name: Install server deps
        run: npm install
        working-directory: server
      - name: Run unit tests
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
